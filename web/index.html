<!doctype html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="description" content="Do a kickflip" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="ollie" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>ollie</title>
        <link rel="manifest" href="manifest.json" />
    </head>
    <body>
        <script src="flutter_bootstrap.js" async></script>
        <script nonce="">
            document.body.addEventListener("contextmenu", function (event) {
                event.preventDefault();
            });
        </script>
        <script>
            const clearBrowserStorage = async () => {
                // clear version only in localStorage
                localStorage.removeItem("app_version");
                sessionStorage.clear();
                if ("caches" in window) {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) await caches.delete(name);
                }
                if ("serviceWorker" in navigator) {
                    const registrations =
                        await navigator.serviceWorker.getRegistrations();
                    for (const reg of registrations) await reg.unregister();
                }
            };
            const checkVersion = async () => {
                try {
                    const res = await fetch(
                        "/version.json?v=" + new Date().getTime(),
                        {
                            cache: "no-cache",
                        },
                    );

                    // Check if response is actually JSON
                    const contentType = res.headers.get("content-type");
                    if (
                        !contentType ||
                        !contentType.includes("application/json")
                    ) {
                        console.warn(
                            "Version check returned non-JSON response, clearing cache",
                        );
                        await clearBrowserStorage();
                        location.reload(true);
                        return;
                    }

                    const { version: latestVersion } = await res.json();
                    const currentVersion = localStorage.getItem("app_version");
                    if (!currentVersion) {
                        localStorage.setItem("app_version", latestVersion);
                    } else if (currentVersion !== latestVersion) {
                        await clearBrowserStorage();
                        localStorage.setItem("app_version", latestVersion);
                        location.reload(true);
                    }
                } catch (e) {
                    console.warn("Version check failed:", e);
                }
            };

            const zoomStorageKey = "ollie_web_zoom";
            const minZoom = 0.75;
            const maxZoom = 2.5;
            const zoomStep = 0.1;

            const clampZoom = (value) =>
                Math.min(maxZoom, Math.max(minZoom, value));

            const applyZoom = (zoom) => {
                document.body.style.zoom = String(zoom);
            };

            let zoomLevel = clampZoom(
                Number(localStorage.getItem(zoomStorageKey)) || 1,
            );
            applyZoom(zoomLevel);

            window.addEventListener(
                "wheel",
                (event) => {
                    if (!event.ctrlKey) return;

                    event.preventDefault();
                    zoomLevel = clampZoom(
                        zoomLevel + (event.deltaY < 0 ? zoomStep : -zoomStep),
                    );
                    localStorage.setItem(zoomStorageKey, String(zoomLevel));
                    applyZoom(zoomLevel);
                },
                { passive: false },
            );

            window.addEventListener("keydown", (event) => {
                if (!event.ctrlKey || event.key !== "0") return;
                event.preventDefault();
                zoomLevel = 1;
                localStorage.setItem(zoomStorageKey, "1");
                applyZoom(zoomLevel);
            });

            window.addEventListener("load", checkVersion);
            setInterval(checkVersion, 30000);
        </script>
    </body>
</html>
