version: "3.8"

services:
  ollie-realtime:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # SSL Configuration (uncomment and set paths to enable HTTPS/WSS)
      # - SSL_CERT_PATH=/etc/ssl/certs/fullchain.pem
      # - SSL_KEY_PATH=/etc/ssl/certs/privkey.pem
    volumes:
      # Mount SSL certificates from host (uncomment when using SSL)
      # - /etc/letsencrypt/live/your-domain.com/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      # - /etc/letsencrypt/live/your-domain.com/privkey.pem:/etc/ssl/certs/privkey.pem:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "--no-check-certificate",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
