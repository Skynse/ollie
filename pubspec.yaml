name: ollie
description: "Local-first kanban boards with sprints, time tracking and burndown."
publish_to: "none"
version: 2.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.5
  flutter_riverpod: ^3.0.3
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
